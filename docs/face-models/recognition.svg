<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" role="img" aria-label="Recognition: time per face against known people named">
<title>Recognition: time per face against known people named</title>
<style>svg{--s:#fcfcfb;--p:#0b0b0b;--m:#52514e;--g:#e4e3df;--a:#7c7b75;--c:#2a78d6}@media (prefers-color-scheme:dark){svg{--s:#1a1a19;--p:#f0efec;--m:#c3c2b7;--g:#34332f;--a:#8f8e86;--c:#3987e5}}text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--p)}.m{fill:var(--m);font-size:12px}.t{font-size:15px;font-weight:600}</style>
<rect width="720" height="430" rx="8" fill="var(--s)"/>
<text class="t" x="64" y="26">Recognition: time per face against known people named</text>
<line x1="64" x2="692" y1="368.0" y2="368.0" stroke="var(--g)"/>
<text class="m" x="56" y="372.0" text-anchor="end">88%</text>
<line x1="64" x2="692" y1="274.5" y2="274.5" stroke="var(--g)"/>
<text class="m" x="56" y="278.5" text-anchor="end">92%</text>
<line x1="64" x2="692" y1="180.9" y2="180.9" stroke="var(--g)"/>
<text class="m" x="56" y="184.9" text-anchor="end">96%</text>
<line x1="64" x2="692" y1="87.4" y2="87.4" stroke="var(--g)"/>
<text class="m" x="56" y="91.4" text-anchor="end">100%</text>
<text class="m" x="64.0" y="388" text-anchor="middle">20 ms</text>
<text class="m" x="204.5" y="388" text-anchor="middle">50 ms</text>
<text class="m" x="310.9" y="388" text-anchor="middle">100 ms</text>
<text class="m" x="417.2" y="388" text-anchor="middle">200 ms</text>
<text class="m" x="557.7" y="388" text-anchor="middle">500 ms</text>
<text class="m" x="664.0" y="388" text-anchor="middle">1000 ms</text>
<text class="m" x="378.0" y="416" text-anchor="middle">Time per face on a 2-core machine (log scale)</text>
<text class="m" x="66" y="56">↖ better: faster and more accurate</text>
<polyline fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round" points="126.2,171.6 166.4,127.1 280.4,115.4 531.3,110.8"/>
<circle cx="126.2" cy="171.6" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="138.2" y="176.6" text-anchor="start">EdgeFace XS<tspan class="m"> 7 MB</tspan></text>
<circle cx="166.4" cy="127.1" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="176.4" y="147.1" text-anchor="start">EdgeFace S<tspan class="m"> 15 MB</tspan></text>
<circle cx="280.4" cy="115.4" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="280.4" y="102.4" text-anchor="middle">EdgeFace Base<tspan class="m"> 73 MB</tspan></text>
<circle cx="531.3" cy="110.8" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="531.3" y="97.8" text-anchor="middle">buffalo_l<tspan class="m"> 174 MB</tspan></text>
<circle cx="328.2" cy="183.3" r="5" fill="var(--s)" stroke="var(--a)" stroke-width="2"/>
<text x="340.2" y="188.3" text-anchor="start">SFace<tspan class="m"> 39 MB</tspan></text>
<circle cx="612.6" cy="335.3" r="5" fill="var(--s)" stroke="var(--a)" stroke-width="2"/>
<text x="600.6" y="340.3" text-anchor="end">AuraFace<tspan class="m"> 261 MB</tspan></text>
<line x1="442" x2="464" y1="52" y2="52" stroke="var(--c)" stroke-width="2"/><circle cx="453" cy="52" r="5" fill="var(--c)" stroke="var(--s)" stroke-width="2"/><text class="m" x="470" y="56">Best trade-offs</text>
<circle cx="574" cy="52" r="5" fill="var(--s)" stroke="var(--a)" stroke-width="2"/><text class="m" x="584" y="56">Beaten by another</text>
</svg>
