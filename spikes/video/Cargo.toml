[package]
name = "spike-video"
version = "0.0.0"
edition = "2024"
publish = false
description = "M0b spike: video playback with libmpv (software render API) inside an eframe / wgpu window. Throwaway."

# Standalone, not part of any workspace.
[workspace]

[dependencies]
eframe = "=0.37.0"
libloading = "0.8"
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
