[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
db = { path = "crates/db" }
media = { path = "crates/media" }
indexer = { path = "crates/indexer" }
meta = { path = "crates/meta" }

# egui, eframe, egui_kittest and wgpu change APIs between minor versions: pin exact versions.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "=0.37.0"
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }

anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
icu_datetime = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = "2.4.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["image"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
libc = "0.2.191"
libloading = "0.8.9"
thumbhash = "0.1.0"
# Finding the subject of a photo (spec 022), pure Rust on the CPU.
tract-onnx = { version = "0.23.9", default-features = false }
webp = { version = "=0.3.1", default-features = false }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg", "datepicker"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
md-5 = "0.11.0"
sys-locale = "0.3.2"
sha2 = "0.11.1"
notify = { version = "8.2.1", default-features = false }
quick-xml = "0.41.0"
regex = "1.12"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
unicode-normalization = "0.1.26"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The web build (spec 019).
js-sys = "0.3.106"
sqlite-wasm-rs = "0.6.2"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.56"
web-sys = "0.3.106"
web-time = "1.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Full debug info makes target/ huge; line tables keep file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

# Decoding and layout are slow without optimizations; keep dependencies optimized in dev builds.
# Nobody steps through dependencies in a debugger, so they get no debug info.
[profile.dev.package."*"]
opt-level = 3
debug = false
