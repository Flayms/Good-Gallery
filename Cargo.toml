[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
db = { path = "crates/db" }
media = { path = "crates/media" }
indexer = { path = "crates/indexer" }

# egui, eframe, egui_kittest and wgpu change APIs between minor versions: pin exact versions.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "=0.37.0"
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }

anyhow = "1.0.104"
regex = "1.12"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Decoding and layout are slow without optimizations; keep dependencies optimized in dev builds.
[profile.dev.package."*"]
opt-level = 3
