[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
db = { path = "crates/db" }
media = { path = "crates/media" }
indexer = { path = "crates/indexer" }

# egui, eframe, egui_kittest and wgpu change APIs between minor versions: pin exact versions.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "=0.37.0"
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }

anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
notify = { version = "8.2.1", default-features = false }
regex = "1.12"
tempfile = "3"
thiserror = "2.0.21"
tracing = "0.1"
unicode-normalization = "0.1.26"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

# Decoding and layout are slow without optimizations; keep dependencies optimized in dev builds.
[profile.dev.package."*"]
opt-level = 3
