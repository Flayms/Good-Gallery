# git-cliff configuration: turns conventional commits into CHANGELOG.md and the GitHub release notes.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Good Gallery. Versions follow [Semantic Versioning](https://semver.org), \
entries are generated from [Conventional Commits](https://www.conventionalcommits.org).
"""
body = """
{%- set repo = "https://github.com/Flayms/Good-Gallery" -%}
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) · {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
  ## Unreleased
{%- endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking %}
### ⚠️ Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {{ commit.breaking_description | default(value=commit.message) | upper_first }}
{%- endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
  ([`{{ commit.id | truncate(length=7, end="") }}`]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor -%}
{% if previous.version and version %}
**Full changelog:** [{{ previous.version }}...{{ version }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# The HTML comments only order the groups; `striptags` removes them from the output.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📝 Documentation" },
  { message = "^revert", group = "<!-- 5 -->⏪ Reverts" },
  { message = "^(test|build|ci|chore)", group = "<!-- 6 -->🔧 Maintenance" },
  { message = "^style", skip = true },
]

[bump]
features_always_bump_minor = true
# Before 1.0.0 a breaking change bumps the minor version; from 1.0.0 on it bumps the major version.
breaking_always_bump_major = false
initial_tag = "v0.1.0"
