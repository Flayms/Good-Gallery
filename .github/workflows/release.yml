# Publishes a GitHub release with the Windows installer, the portable zip and the Linux archive for every version tag
# pushed by `cargo xtask release` (xtask/src/release.rs, docs/specs/014-ci-release, docs/specs/018-linux).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build the Linux archive
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the Linux archive
        run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Build and publish
    needs: [checks, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # git-cliff needs the tags and commits since the previous release.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Check the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "app") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml has version $version, but the tag is $TAG."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fetch exiftool, ffmpeg and libmpv
        shell: pwsh
        run: ./packaging/fetch-helpers.ps1

      - name: Build the installer and the portable zip
        run: cargo xtask dist

      - name: Smoke test the installed app
        shell: pwsh
        run: ./packaging/smoke-test.ps1 -Installer "target/dist/good-gallery-$env:VERSION-setup.exe"

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: target/dist

      - name: Write the release notes
        run: |
          # The release title already names the version, so drop the section heading.
          git-cliff --current --strip all | tail -n +2 > release-notes.md
          cat >> release-notes.md <<NOTES

          ### 📥 Download

          | File | For |
          | --- | --- |
          | **good-gallery-$VERSION-setup.exe** | Installer: pick the folder, installs for your user |
          | **good-gallery-$VERSION-portable.zip** | Portable: extract anywhere and run \`good-gallery.exe\` |
          | **good-gallery-$VERSION-linux-x86_64.tar.gz** | Linux: extract, install exiftool, ffmpeg and libmpv from your distribution (see \`README.txt\`), run \`./install.sh\` or \`./good-gallery\` |

          The Windows downloads keep the index, settings and thumbnail cache in \`%APPDATA%\\good-gallery\`, the Linux one in \`~/.local/share/good-gallery\`, so an update picks them up as they are.

          The downloads aren't code-signed yet, so Windows SmartScreen may warn about them. For the installer choose _More info_ → _Run anyway_. For the zip, right-click it → _Properties_ → _Unblock_ before extracting.
          NOTES
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "target/dist/good-gallery-$VERSION-setup.exe" \
            "target/dist/good-gallery-$VERSION-portable.zip" \
            "target/dist/good-gallery-$VERSION-linux-x86_64.tar.gz" \
            --title "Good Gallery $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
