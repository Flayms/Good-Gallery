# Publishes a GitHub release with the Windows installer and its signature (REQ-031-09), the portable zip and the Linux downloads for every version tag
# pushed by `cargo xtask release` (xtask/src/release.rs, docs/specs/014-ci-release, docs/specs/018-linux), and the
# browser version to the repository's GitHub Pages site and as a zip (docs/specs/019-web). Pages' source must be set
# to "GitHub Actions" in the repository's settings.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    # A called workflow gets no more than this, and ci.yml's review job asks for it (it skips outside pull requests).
    permissions:
      contents: read
      pull-requests: write

  linux:
    name: Build and test the Linux downloads
    uses: ./.github/workflows/linux-packages.yml

  web:
    name: Build the page
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # A tag's cache can only be restored by the same tag, so saving it is wasted time.
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - run: cargo xtask web
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: target/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: page-zip
          path: target/dist/*-web.zip
          if-no-files-found: error

  pages:
    name: Publish the page
    # Not before the release exists, so the page never goes live for a version whose release failed (REQ-014-14).
    needs: [web, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page
          path: target/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/web
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Build and test the Windows downloads
    uses: ./.github/workflows/windows-packages.yml

  publish:
    name: Publish the release
    needs: [checks, linux, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: page-zip
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      # What the app's updater verifies; stops here if the key isn't the one the app has built in (REQ-031-09).
      - name: Sign the installer
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash packaging/sign-update.sh "target/dist/good-gallery-${TAG#v}-windows-x64-setup.exe"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            "target/dist/good-gallery-$VERSION-windows-x64-setup.exe" \
            "target/dist/good-gallery-$VERSION-windows-x64-setup.exe.sig" \
            "target/dist/good-gallery-$VERSION-windows-x64-portable.zip" \
            "target/dist/good-gallery-$VERSION-linux-x64.tar.gz" \
            "target/dist/good-gallery-$VERSION-linux-x64.deb" \
            "target/dist/good-gallery-$VERSION-linux-x64.rpm" \
            "target/dist/good-gallery-$VERSION-web.zip" \
            --title "Good Gallery $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
