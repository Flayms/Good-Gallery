# Publishes a GitHub release with the Windows installer, the portable zip and the Linux downloads for every version tag
# pushed by `cargo xtask release` (xtask/src/release.rs, docs/specs/014-ci-release, docs/specs/018-linux), and the
# browser version to the repository's GitHub Pages site and as a zip (docs/specs/019-web). Pages' source must be set
# to "GitHub Actions" in the repository's settings.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build and test the Linux downloads
    uses: ./.github/workflows/linux-packages.yml

  web:
    name: Build the page
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # A tag's cache can only be restored by the same tag, so saving it is wasted time.
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - run: cargo xtask web
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: target/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: page-zip
          path: target/dist/*-web.zip
          if-no-files-found: error

  pages:
    name: Publish the page
    # Not before the release exists, so the page never goes live for a version whose release failed (REQ-014-14).
    needs: [web, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: page
          path: target/web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/web
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Build and test the Windows downloads
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # git-cliff needs the tags and commits since the previous release.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # What release-cache.yml saves on main (REQ-014-14).
          shared-key: release
          # A tag's cache can only be restored by the same tag, so saving it is wasted time.
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Check the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "app") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml has version $version, but the tag is $TAG."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The verified downloads, which the script reuses: a download from SourceForge sometimes isn't the file.
      - uses: actions/cache@v4
        with:
          path: target/helpers/downloads
          key: helpers-${{ hashFiles('packaging/fetch-helpers.ps1') }}
      - name: Fetch exiftool, ffmpeg and libmpv
        shell: pwsh
        run: ./packaging/fetch-helpers.ps1

      # windows-2025 images don't come with NSIS; Chocolatey installs it where `cargo xtask dist` finds it.
      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build the installer and the portable zip
        run: cargo xtask dist

      - name: Smoke test the installed app
        shell: pwsh
        run: ./packaging/smoke-test.ps1 -Installer "target/dist/good-gallery-$env:VERSION-windows-x64-setup.exe"

      # Here, since this job has already compiled xtask.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes also list the changes of earlier versions whose release run failed (REQ-014-11).
          published=$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          cargo xtask release-notes "$TAG" $published > release-notes.md
          cat >> release-notes.md <<NOTES

          ### 📥 Download

          | File | For |
          | --- | --- |
          | **good-gallery-$VERSION-windows-x64-setup.exe** | Installer: pick the folder, installs for your user |
          | **good-gallery-$VERSION-windows-x64-portable.zip** | Portable: extract anywhere and run \`good-gallery.exe\` |
          | **good-gallery-$VERSION-linux-x64.tar.gz** | Linux: extract, install exiftool, ffmpeg and libmpv from your distribution (see \`README.txt\`), run \`./install.sh\` or \`./good-gallery\` |
          | **good-gallery-$VERSION-linux-x64.deb** | Ubuntu 24.04 or newer: \`sudo apt install ./good-gallery-$VERSION-linux-x64.deb\` brings the helpers too |
          | **good-gallery-$VERSION-linux-x64.rpm** | Fedora: \`sudo dnf install ./good-gallery-$VERSION-linux-x64.rpm\` brings the helpers too. For all video codecs, install ffmpeg from RPM Fusion |
          | **good-gallery-$VERSION-web.zip** | Browser version to host yourself: put the files on any static web server, served over HTTPS |

          The Windows downloads keep the index, settings and thumbnail cache in \`%APPDATA%\\good-gallery\`, the Linux one in \`~/.local/share/good-gallery\`, so an update picks them up as they are.

          The downloads aren't code-signed yet, so Windows SmartScreen may warn about them. For the installer choose _More info_ → _Run anyway_. For the zip, right-click it → _Properties_ → _Unblock_ before extracting.
          NOTES
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dist/*-setup.exe
            target/dist/*-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [checks, linux, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: page-zip
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            "target/dist/good-gallery-$VERSION-windows-x64-setup.exe" \
            "target/dist/good-gallery-$VERSION-windows-x64-portable.zip" \
            "target/dist/good-gallery-$VERSION-linux-x64.tar.gz" \
            "target/dist/good-gallery-$VERSION-linux-x64.deb" \
            "target/dist/good-gallery-$VERSION-linux-x64.rpm" \
            "target/dist/good-gallery-$VERSION-web.zip" \
            --title "Good Gallery $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
