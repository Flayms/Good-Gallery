# Checks every commit and pull request (docs/specs/014-ci-release). The release workflow reuses this one.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-specs

  test:
    name: Test
    # The app, its native dependencies and the snapshot tests (wgpu on WARP) target Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The release script's tests (xtask/src/release.rs) run git-cliff; with CI set they fail without it.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      # The bundled exiftool and ffmpeg, so the indexing and thumbnail tests run instead of skipping. libmpv isn't
      # set: it needs the Vulkan loader, which the runner images may lack (the video tests skip without it).
      - name: Fetch exiftool, ffmpeg and libmpv
        shell: pwsh
        run: ./packaging/fetch-helpers.ps1
      - run: cargo test --workspace
        env:
          GOOD_GALLERY_EXIFTOOL: ${{ github.workspace }}\target\helpers\exiftool\exiftool.exe
          GOOD_GALLERY_FFMPEG: ${{ github.workspace }}\target\helpers\ffmpeg\ffmpeg.exe
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: crates/*/tests/snapshots/*.diff.png
          if-no-files-found: ignore
