# Checks pushes to main and pull requests (docs/specs/014-ci-release). The release workflow reuses this one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft gets its agent review (REQ-014-17) once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    # A release commit pushed to main skips these: its tag's release run checks the same commit (REQ-014-01).
    # The condition checks the ref, since the release run (a tag push) sees the same head_commit.
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)')
    strategy:
      fail-fast: false
      matrix:
        # Linux too (docs/specs/018-linux): clippy checks each platform's own code.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache, which pull requests restore: saving takes a minute, and caches saved by pull
          # requests would push main's out of GitHub's 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check-specs

  test:
    name: Test (Windows)
    # Release commits: see lint.
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)')
    # The snapshot tests render with wgpu on WARP.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache, which pull requests restore: saving takes a minute, and caches saved by pull
          # requests would push main's out of GitHub's 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # nextest runs the tests; the release script's tests (xtask/src/release.rs) run git-cliff, with CI set they fail
      # without it.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2,cargo-nextest@0.9.150
      # The verified downloads, which the script reuses: a download from SourceForge sometimes isn't the file.
      - uses: actions/cache@v4
        with:
          path: target/helpers/downloads
          key: helpers-${{ hashFiles('packaging/fetch-helpers.ps1') }}
      # The bundled exiftool and ffmpeg, so the indexing and thumbnail tests run instead of skipping. libmpv isn't
      # set: it needs the Vulkan loader, which the runner images may lack (the video tests skip without it).
      - name: Fetch exiftool, ffmpeg and libmpv
        shell: pwsh
        run: ./packaging/fetch-helpers.ps1
      # nextest runs the test binaries in parallel, cargo test one after another; every test runs, so the uploaded
      # diffs show all failing snapshots (.config/nextest.toml). nextest doesn't run doctests, so cargo test does.
      - run: cargo nextest run --workspace --profile ci
        env:
          GOOD_GALLERY_EXIFTOOL: ${{ github.workspace }}\target\helpers\exiftool\exiftool.exe
          GOOD_GALLERY_FFMPEG: ${{ github.workspace }}\target\helpers\ffmpeg\ffmpeg.exe
      - run: cargo test --workspace --doc
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-windows
          # The new renders too: a snapshot that doesn't exist yet on this platform can be taken from them.
          path: |
            crates/*/tests/snapshots/*.diff.png
            crates/*/tests/snapshots/*.new.png
          if-no-files-found: ignore

  test-linux:
    name: Test (Linux)
    # Release commits: see lint.
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    # The Linux snapshots (`*_linux.png`) were rendered with Ubuntu 26.04's lavapipe and the video tests need its mpv
    # (0.41), so the tests run in that release, not whatever ubuntu-latest is (docs/specs/018-linux).
    container: ubuntu:26.04
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      # The distribution's helpers, as the app uses them there (REQ-018-03), lavapipe for wgpu, and the build tools.
      - name: Install the build tools, exiftool, ffmpeg, libmpv and lavapipe
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential pkg-config libimage-exiftool-perl ffmpeg libmpv2 mesa-vulkan-drivers libvulkan1
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache, which pull requests restore: saving takes a minute, and caches saved by pull
          # requests would push main's out of GitHub's 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2,cargo-nextest@0.9.150
      # See the Windows tests.
      - run: cargo nextest run --workspace --profile ci
        env:
          GG_REQUIRE_HELPERS: '1'
      - run: cargo test --workspace --doc
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-linux
          # The new renders too: a snapshot that doesn't exist yet on this platform can be taken from them.
          path: |
            crates/*/tests/snapshots/*.diff.png
            crates/*/tests/snapshots/*.new.png
          if-no-files-found: ignore

  web:
    name: Test (web)
    # Release commits: see lint.
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)')
    # The browser version (docs/specs/019-web): clippy for wasm, the page, and its end-to-end tests in Chromium. clang
    # (preinstalled) compiles SQLite for wasm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves the cache, which pull requests restore: saving takes a minute, and caches saved by pull
          # requests would push main's out of GitHub's 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - run: cargo clippy -p app -p meta --target wasm32-unknown-unknown -- -D warnings
      - run: cargo xtask web
      - name: Install Playwright and its Chromium
        working-directory: web/tests
        run: npm ci && npx playwright install --with-deps chromium
      - run: cargo xtask web-test --no-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/tests/test-results
          if-no-files-found: ignore

  # The ruleset on main requires the checks "Lint" and "Test" (REQ-014-02). The jobs above run per platform under
  # their own names, so these two report the overall result under the required names; a new platform only adds
  # itself to `needs`.
  lint-result:
    name: Lint
    needs: [lint]
    if: always() && (github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)'))
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.lint.result }}" = success

  test-result:
    name: Test
    needs: [test, test-linux, web]
    if: always() && (github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'chore(release)'))
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success && test "${{ needs.test-linux.result }}" = success \
            && test "${{ needs.web.result }}" = success

  # A second model reviews pull requests once their checks passed (REQ-014-17), with main's `.github/review.md` as its
  # instructions. The reviewer only reads; this job posts its findings and fails on a confident critical or major one.
  # Skipped for drafts and forks (no secrets there). The token is the owner's Claude subscription (`claude setup-token`).
  review:
    name: Review
    needs: [lint-result, test-result]
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.base_ref }}
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN secret, so no agent review"; fi
      - if: steps.token.outputs.present
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read the instructions from main
        if: steps.token.outputs.present
        id: prompt
        # Falls back to the pull request's own file only while main has none.
        run: |
          {
            echo 'text<<END_OF_REVIEW_PROMPT'
            echo "Pull request #$PR into \`$BASE\` (compare with \`origin/$BASE\`). HEAD is checked out with its changes."
            echo
            git show "origin/$BASE:.github/review.md" 2>/dev/null || cat .github/review.md
            echo 'END_OF_REVIEW_PROMPT'
          } >> "$GITHUB_OUTPUT"
      - name: Review
        if: steps.token.outputs.present
        id: review
        # A review that doesn't finish (the subscription's limit, an outage) must not block merging; the next step warns.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model sonnet --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","required":["summary","findings"],"properties":{"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","required":["severity","category","confidence","file","line","title","scenario"],"properties":{"severity":{"enum":["critical","major","minor"]},"category":{"enum":["correctness","security","performance","readability"]},"confidence":{"type":"integer","minimum":0,"maximum":100},"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"scenario":{"type":"string"},"fix":{"type":"string"}}}}}}'
      - name: Post the findings
        if: steps.token.outputs.present
        env:
          REVIEW: ${{ steps.review.outputs.structured_output }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! printf '%s' "$REVIEW" | jq -e '.findings' > /dev/null 2>&1; then
            printf "<!-- agent-review -->\n## Agent review of %s\n\nThe review didn't finish, so this push has none: [the run](%s).\n" \
              "${SHA:0:7}" "$RUN" > comment.md
            echo "::warning::The agent review didn't finish"
          else
            printf '%s' "$REVIEW" > review.json
            # Below 80 the reviewer isn't sure: listed apart, never blocking.
            jq -r --arg sha "${SHA:0:7}" '
              def line: "- **\(.severity)** · \(.category) · `\(.file):\(.line)`: \(.title)\n\n  \(.scenario)"
                + if (.fix // "") != "" then "\n\n  Fix: \(.fix)" else "" end;
              def order: sort_by({critical: 0, major: 1, minor: 2}[.severity]);
              (.findings | map(select(.confidence >= 80)) | order) as $sure
              | (.findings | map(select(.confidence < 80)) | order) as $unsure
              | "<!-- agent-review -->\n## Agent review of \($sha)\n\n\(.summary)\n\n"
                + if ($sure | length) == 0 then "No findings." else $sure | map(line) | join("\n") end
                + if ($unsure | length) == 0 then ""
                  else "\n\n<details><summary>Less certain (never blocking)</summary>\n\n"
                    + ($unsure | map(line + " (confidence \(.confidence))") | join("\n")) + "\n\n</details>" end
            ' review.json > comment.md
          fi
          # One comment per pull request: a later review replaces it.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- agent-review -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else gh pr comment "$PR" --body-file comment.md; fi
          if [ -s review.json ] && jq -e 'any(.findings[]; .severity != "minor" and .confidence >= 80)' review.json > /dev/null; then
            echo "::error::The agent review found critical or major problems; see its comment on the pull request"
            exit 1
          fi
