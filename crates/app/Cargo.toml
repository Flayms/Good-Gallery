[package]
name = "app"
description = "Good Gallery, the desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The installed or portable app (`cargo xtask dist`): the data folder `%APPDATA%\good-gallery`, no console window.
packaged = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
db.workspace = true
egui_extras.workspace = true
indexer.workspace = true
eframe.workspace = true
image.workspace = true
tracing.workspace = true
jiff.workspace = true
tracing-subscriber.workspace = true
web-time.workspace = true
serde_json.workspace = true
domain.workspace = true
thumbhash.workspace = true
base64.workspace = true
icu_datetime.workspace = true
icu_locale_core.workspace = true
sys-locale.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Helper programs, files by path, libmpv and threads: the desktop app only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading.workspace = true
media.workspace = true
rfd.workspace = true
webp.workspace = true

# The browser version (spec 019).
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
js-sys.workspace = true
meta.workspace = true
# The index's snapshot in the page's storage (`web::index`).
rusqlite = { workspace = true, features = ["backup", "serialize"] }
# SQLite's clock, randomness and local time come from the browser.
sqlite-wasm-rs = { workspace = true, features = ["wasm-bindgen"] }
sys-locale = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "console",
    "Document",
    "Element",
    "File",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "ImageBitmap",
    "Performance",
    "Window",
] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
tempfile.workspace = true
egui_kittest.workspace = true

[lints]
workspace = true
