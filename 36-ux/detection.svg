<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" role="img" aria-label="Detection: time per photo against large faces found">
<title>Detection: time per photo against large faces found</title>
<style>svg{--s:#fcfcfb;--p:#0b0b0b;--m:#52514e;--g:#e4e3df;--a:#7c7b75;--c:#2a78d6}@media (prefers-color-scheme:dark){svg{--s:#1a1a19;--p:#f0efec;--m:#c3c2b7;--g:#34332f;--a:#8f8e86;--c:#3987e5}}text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--p)}.m{fill:var(--m);font-size:12px}.t{font-size:15px;font-weight:600}</style>
<rect width="720" height="430" rx="8" fill="var(--s)"/>
<text class="t" x="64" y="26">Detection: time per photo against large faces found</text>
<line x1="64" x2="692" y1="368.0" y2="368.0" stroke="var(--g)"/>
<text class="m" x="56" y="372.0" text-anchor="end">88%</text>
<line x1="64" x2="692" y1="274.5" y2="274.5" stroke="var(--g)"/>
<text class="m" x="56" y="278.5" text-anchor="end">92%</text>
<line x1="64" x2="692" y1="180.9" y2="180.9" stroke="var(--g)"/>
<text class="m" x="56" y="184.9" text-anchor="end">96%</text>
<line x1="64" x2="692" y1="87.4" y2="87.4" stroke="var(--g)"/>
<text class="m" x="56" y="91.4" text-anchor="end">100%</text>
<text class="m" x="140.4" y="388" text-anchor="middle">0.5 s</text>
<text class="m" x="244.0" y="388" text-anchor="middle">1 s</text>
<text class="m" x="347.7" y="388" text-anchor="middle">2 s</text>
<text class="m" x="484.7" y="388" text-anchor="middle">5 s</text>
<text class="m" x="588.4" y="388" text-anchor="middle">10 s</text>
<text class="m" x="378.0" y="416" text-anchor="middle">Average time per photo on a 2-core machine (log scale)</text>
<text class="m" x="66" y="56">↖ better: faster and more accurate</text>
<polyline fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round" points="135.8,302.5 389.8,141.2 594.2,87.4"/>
<circle cx="135.8" cy="302.5" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="147.8" y="307.5" text-anchor="start">YuNet<tspan class="m"> 233 KB</tspan></text>
<circle cx="389.8" cy="141.2" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="399.8" y="161.2" text-anchor="start">RetinaFace MobileNetV2<tspan class="m"> 12.5 MB</tspan></text>
<circle cx="594.2" cy="87.4" r="6" fill="var(--c)" stroke="var(--s)" stroke-width="2"/>
<text x="608.2" y="75.4" text-anchor="end">RetinaFace ResNet34<tspan class="m"> 88.5 MB, 25 faces</tspan></text>
<line x1="442" x2="464" y1="52" y2="52" stroke="var(--c)" stroke-width="2"/><circle cx="453" cy="52" r="5" fill="var(--c)" stroke="var(--s)" stroke-width="2"/><text class="m" x="470" y="56">Best trade-offs</text>
</svg>
